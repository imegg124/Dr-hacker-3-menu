<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #ffffff, #d0e8ff);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            text-align: center;
        }

        .greeting {
            font-size: 24px;
            font-weight: 600;
            color: #1a365d;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background-color: #0066cc;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            min-width: 220px;
            text-align: center;
        }

        .btn:hover {
            background-color: #0052a3;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 102, 204, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="greeting">Greetings my friend im just a coder check my projects down here</h1>
        <a href="https://github.com/imegg124/Dr-hacker-3-menu" class="btn" target="_blank" rel="noopener noreferrer">my mod menu</a>
        <a href="https://github.com/imegg124" class="btn" target="_blank" rel="noopener noreferrer">my github account</a>
    </div>

</body>
</html>
